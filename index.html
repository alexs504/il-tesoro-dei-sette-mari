<style>

.mani{display:flex;gap:4vh;align-items:flex-end;justify-content:center}

.posto i{width:4.5vh;height:4.5vh;border-radius:50%;display:block}
.fuori{display:flex;gap:1vh;margin-left:2vh}

.ruote{display:flex;gap:4vh}
.ruota{display:flex;flex-direction:column;align-items:center;gap:1.2vh}
.ruota button.freccia{width:18vh;height:7vh;border-radius:2vh;background:var(--viola);color:#fff;font-size:4vh}
.finestra{width:24vh;height:22vh;border-radius:3vh;background:#fff;border:1vh solid var(--oro2);display:flex;align-items:center;justify-content:center;font-size:10vh;font-weight:900;color:var(--ink);overflow:hidden}

/* overlay e toast */
#ovl{position:fixed;inset:0;background:rgba(5,25,45,.72);display:none;align-items:center;justify-content:center;z-index:40}

.pannello input[type=checkbox]{width:3vh;height:3vh;vertical-align:middle}
</style>

function nota(f,d,tipo='sine',vol=.18,quando=0){
  const a=ac(); if(!a) return; const t=a.currentTime+quando;
  const o=a.createOscillator(), g=a.createGain(); o.type=tipo; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.05);
}

/* ---------- voci: Capitan Sette (uomo) e pappagallo ---------- */
// Si sceglie la voce migliore presente sul computer. Le più naturali sono quelle di Microsoft Edge (con internet).
const PREF_VOCI = {
  capitano:   [/Diego.*Natural/i, /Giuseppe.*Natural/i, /italiano [34] \(Natural\)/i, /Chrome OS italiano [34]/i, /it-it-x-it[cd]/i, /^Luca/i, /Cosimo/i],
  pappagallo: [/Isabella.*Natural/i, /Elsa.*Natural/i, /^Google italiano$/i, /italiano [12] \(Natural\)/i, /Federica/i, /Alice/i, /Emma/i, /Paola/i, /Elsa/i]
};
const MASCHILI = /Diego|Giuseppe|Luca|Cosimo|italiano [34]|it-it-x-it[cd]/i;
let VOCI_IT = [];
const voceDisponibile = () => ('speechSynthesis' in window);
function caricaVoci(){ try{ VOCI_IT = speechSynthesis.getVoices().filter(v=>/^it/i.test(v.lang)); }catch(e){ VOCI_IT=[]; } aggiornaAscolta(); }
function voceDi(chi){
  const scelta = chi==='pappagallo' ? S.vocePap : S.voceCap;
  if(scelta){ const v=VOCI_IT.find(x=>x.name===scelta); if(v) return v; }
  for(const re of PREF_VOCI[chi]){ const v=VOCI_IT.find(x=>re.test(x.name)); if(v) return v; }
  return VOCI_IT[0]||null;
}
// il pulsante ASCOLTA compare solo se la voce è attiva
function aggiornaAscolta(){
  const on = S.voce && voceDisponibile();
  ['#btnAscoltaIntro','#btnAscolta'].forEach(id=>{ const b=$(id); if(b) b.classList.toggle('hidden', !on); });
}
// testo pulito, frase per frase, così la voce rispetta le pause della punteggiatura
function frasi(t){
  const pulito = String(t).replace(/[«»"“”]/g,'').replace(/N\.\s*(\d)/g,'numero $1').replace(/:/g,',')
    .replace(/\+/g,' più ').replace(/=/g,' fa ').replace(/[^\p{L}\p{N}\s.,!?'’]/gu,' ').replace(/\s+/g,' ').trim().toLowerCase();
  return pulito.split(/(?<=[.!?])\s+/).filter(x=>x.replace(/[.,!?\s]/g,''))
    .map(x=>x.charAt(0).toUpperCase()+x.slice(1));
}
function parla(t, chi='capitano', forza=false){
  if((!S.voce && !forza) || !voceDisponibile() || !t) return;
  try{
    speechSynthesis.cancel();
    const segmenti = Array.isArray(t) ? t : [{t, chi}];
    segmenti.forEach(seg=>{
      const ch = seg.chi||'capitano', v = voceDi(ch), naturale = !!v && /Natural|Online/i.test(v.name);
      frasi(seg.t).forEach(f=>{
        const u = new SpeechSynthesisUtterance(f); u.lang='it-IT'; if(v) u.voice=v;
        if(ch==='pappagallo'){ u.rate=1.02; u.pitch = naturale ? 1 : 1.35; }
        else { u.rate=.9; u.pitch = (naturale || MASCHILI.test(v?v.name:'')) ? 1 : .7; }
        speechSynthesis.speak(u);
      });
    });
  }catch(e){}
}
if(voceDisponibile()){ caricaVoci(); speechSynthesis.onvoiceschanged=caricaVoci; }

let toastT=null;
function toast(em, testo, ko=false, ms=1500){
  const t=$('#toast'); t.className=ko?'ko':''; t.innerHTML=`<span class="em">${em}</span>${testo}`;
  requestAnimationFrame(()=>t.classList.add('on')); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),ms);
}
function ovl(html){ const o=$('#ovl'); o.innerHTML=`<div class="carta">${html}</div>`; o.classList.add('on'); idrata(o); return o; }
function chiudiOvl(){ $('#ovl').classList.remove('on'); $('#ovl').innerHTML=''; }
function coriandoli(ms=3500){
  const c=$('#coriandoli'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#ffc83d','#e8413b','#2fb36b','#2f6fe0','#8b5cf6','#ff9f1c'];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:5+Math.random()*7,a:Math.random()*6,c:pick(cols)}));
  const fine=performance.now()+ms;
  (function f(now){ x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1; x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(now<fine) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })(performance.now());
}

/* ---------- gestione turni ---------- */
function turnoFinito(){
  const i=SFIDA.isola;
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(i===7){ S.turno=Math.max(S.turno,TOT_MOZZI); S.aperto=true; salva(); return; }
  const m=mozzo();
  S.fatte[i]=Math.min(2,S.fatte[i]+1); S.turno++; salva();
  SND.ok(); coriandoli(1600);
  if(S.fatte[i]>=2){
    ovl(`<div style="font-size:12vh">🔓</div><h2>BRAVISSIMO, MOZZO N. ${m}!</h2><p>IL LUCCHETTO N. ${i+1} È APERTO!</p>
      <button class="btn oro big" id="vaiRito">⭐ RITO DEL 7</button>`);
    SND.lucchetto(); parla('Bravissimo! Il lucchetto numero '+(i+1)+' è aperto!');
    $('#vaiRito').onclick=()=>rito(i);
  } else {
    ovl(`<div style="font-size:12vh">⭐</div><h2>BRAVO, MOZZO N. ${m}!</h2><p>MANCA ANCORA UN TURNO PER APRIRE IL LUCCHETTO.</p>
      <button class="btn verde big" id="prossimo">➜ PROSSIMO MOZZO</button>`);

  }
}
async function rito(i){
  const n=S.fatte.filter(f=>f>=2).length;
  ovl(`<h2>RITO DEL 7: TUTTI INSIEME!</h2><p>CONTIAMO FINO A 7 BATTENDO SUL BANCO!</p>
    <div class="tamburi">${Array.from({length:7},(_,k)=>`<div class="tamburo" id="tb${k}">${k+1}</div>`).join('')}</div>

    <button class="btn verde big" id="ritoMappa">⛵ ALLA MAPPA (${n} ⭐ SU 7)</button></div>`);

  for(let k=0;k<7;k++){ const el=$('#tb'+k); if(!el) return; el.classList.add('on'); SND.tamburo(); await wait(850); }
  const f=$('#ritoFine'); if(!f) return; f.classList.remove('hidden'); SND.fanfara(); parla('Ora fate il sette con il corpo!');

   LE SFIDE
   ===================================================================== */
const SFIDE = {};

/* ---------- ISOLA 1: I PESCI LAMPO ---------- */
SFIDE.pesci = function(liv){
  const giri = shuffle(liv===1 ? [7, pick([5,6]), pick([8,9])] : [7, 6, 8]);
  const colori = ['#ff9f1c','#ffd23f','#ff6b6b','#4dd599','#b388ff'];
  let g=0;
  function giro(){
    perle(g,3);
    const n=giri[g], col=colori[g%colori.length]; let errori=0, sel=null, aiuto=false;
    const pos = liv===1 ? posizioniOrdinate(n) : posizioniSparse(n);
    $('#stage').innerHTML=`<div class="pannelloMare" id="mare"></div><div id="zona" class="col"></div>`;
    istr('PREPARATI! I PESCI COMPAIONO PER POCHI SECONDI. QUANTI SONO?');
    $('#zona').innerHTML=`<button class="btn oro big" id="guarda">👀 GUARDA!</button>`;
    $('#guarda').onclick=()=>lampo();
    function disegna(visibili){
      $('#mare').innerHTML = pos.map((p,k)=>`<div class="ogg" style="left:${p[0]}%;top:${p[1]}%;width:16vh;height:9.5vh;opacity:${visibili?1:0}">${svgPesce(col)}${aiuto?`<span class="etich">${k+1}</span>`:''}</div>`).join('');
    }
    async function lampo(){
      $('#zona').innerHTML=''; disegna(true); SND.tic();
      await wait(liv===1?4000:2500);
      $('#mare').querySelectorAll('.ogg').forEach(o=>o.style.opacity=0);
      await wait(400); scegli();
    }
    function scegli(){
      const opz = liv===1 ? shuffle([n-1,n,n+1]) : [5,6,7,8,9];
      istr('QUANTI PESCI HAI VISTO?');
      $('#zona').innerHTML=`<div class="row">${opz.map(v=>`<button class="num" data-v="${v}">${v}</button>`).join('')}
        ${liv===1&&!aiuto?'<button class="btn blu" id="rivedi">👀 RIVEDI</button>':''}</div>${barraConferma()}`;
      $('#zona').querySelectorAll('.num').forEach(b=>b.onclick=()=>{ SND.click(); sel=+b.dataset.v; $('#zona').querySelectorAll('.num').forEach(x=>x.classList.toggle('sel',x===b)); });
      const rv=$('#rivedi'); if(rv) rv.onclick=()=>{ rv.remove(); lampo(); };
      $('#conferma').onclick=()=>{
        if(sel===null){ toast('☝','TOCCA UN NUMERO!',true); return; }
        if(sel===n){ SND.ok(); toast('⭐','SÌ! ERANO '+n+'!'); parla('Sì! Erano '+n); g++; perle(g,3); setTimeout(()=>g<3?giro():turnoFinito(),1700); }
        else { errori++; SND.ko(); sel=null;
          if(errori>=2){ aiuto=true; toast('🦜','CONTIAMOLI INSIEME!',true); disegna(true); istr('CONTIAMOLI INSIEME, UNO ALLA VOLTA. POI TOCCA IL NUMERO GIUSTO.'); setTimeout(scegliAiuto,300); }
          else { toast('🦜','QUASI! GUARDALI DI NUOVO!',true); setTimeout(lampo,1600); } }
      };
    }
    function scegliAiuto(){ disegna(true); scegliSenzaNascondere(); }
    function scegliSenzaNascondere(){
      const opz = liv===1 ? shuffle([n-1,n,n+1]) : [5,6,7,8,9];
      $('#zona').innerHTML=`<div class="row">${opz.map(v=>`<button class="num" data-v="${v}">${v}</button>`).join('')}</div>${barraConferma()}`;
      $('#zona').querySelectorAll('.num').forEach(b=>b.onclick=()=>{ SND.click(); sel=+b.dataset.v; $('#zona').querySelectorAll('.num').forEach(x=>x.classList.toggle('sel',x===b)); });
      $('#conferma').onclick=()=>{ if(sel===n){ SND.ok(); toast('⭐','SÌ! ERANO '+n+'!'); g++; perle(g,3); setTimeout(()=>g<3?giro():turnoFinito(),1700);} else { SND.ko(); toast('🦜','CONTA ANCORA!',true);} };
    }
  }
  giro();
};
function posizioniOrdinate(n){
  const sopra=Math.min(5,n), sotto=n-sopra, res=[];
  for(let k=0;k<sopra;k++) res.push([14+k*18, sotto?32:50]);
  const off=(5-sotto)*9;
  for(let k=0;k<sotto;k++) res.push([14+off+k*18, 70]);
  return res;
}
function posizioniSparse(n){
  const celle=[]; for(let r=0;r<3;r++) for(let c=0;c<5;c++) celle.push([c,r]);
  return shuffle(celle).slice(0,n).map(([c,r])=>[12+c*19+(Math.random()*5-2.5), 20+r*30+(Math.random()*4-2)]);
}

/* ---------- ISOLA 2: LE MANI DEL CAPITANO ---------- */
SFIDE.mani = function(liv){
  const primo = S.fatte[1]===0;
  const compiti = primo ? ['libero',['completa',4],['troppe',9]] : ['diverso',['completa',2],['troppe',10]];
  let g=0;
  function giro(){
    perle(g,3);
    const c = compiti[g], tipo = Array.isArray(c)?c[0]:c, par = Array.isArray(c)?c[1]:0;
    let L=[0,0,0,0,0], R=[0,0,0,0,0], bloccoL=false, errori=0, aiuto=false;
    if(tipo==='completa'){ for(let k=0;k<par;k++) L[k]=1; bloccoL=true; }
    if(tipo==='troppe'){ L=[1,1,1,1,1]; R=[0,0,0,0,0]; for(let k=0;k<par-5;k++) R[k]=1; }
    const testi = {
      libero:'ALZA LE DITA DEI GUANTI DEL CAPITANO. FAI 7!',
      diverso:'FAI 7 CON LE DITA, MA IN UN MODO DIVERSO DA QUELLO DEL TUO COMPAGNO!',
      completa:`IL GUANTO ROSSO HA GIÀ ${par} DITA ALZATE. ALZA LE DITA DEL GUANTO BLU PER ARRIVARE A 7!`,
      troppe:`OH NO! IL CAPITANO HA ALZATO TROPPE DITA. ABBASSANE ALCUNE PER AVERE 7!`
    };
    istr(testi[tipo]);
    const tot=()=>L.reduce((a,b)=>a+b,0)+R.reduce((a,b)=>a+b,0);
    function disegna(){
      let k=0; const numL=L.map(v=>v?++k:0), numR=R.map(v=>v?++k:0);
      $('#stage').innerHTML=`<div class="mani">
        <div class="mano" id="mL">${svgMano('L',L,bloccoL,aiuto?numL:null)}</div>
        ${liv===1||aiuto?`<div class="contatore">${tot()}</div>`:`<div class="contatore" style="font-size:10vh">?</div>`}
        <div class="mano" id="mR">${svgMano('R',R,false,aiuto?numR:null)}</div></div>${barraConferma()}`;
      $('#stage').querySelectorAll('.dito').forEach(d=>d.onclick=()=>{
        const m=d.dataset.m, i=+d.dataset.i;
        if(m==='L'&&bloccoL){ SND.ko(); toast('🔒','IL GUANTO ROSSO È BLOCCATO!',true); return; }
        const arr=m==='L'?L:R; arr[i]=arr[i]?0:1; SND.click(); disegna();
      });
      $('#conferma').onclick=verifica;
    }
    function verifica(){
      const t=tot(), sl=L.reduce((a,b)=>a+b,0), sr=R.reduce((a,b)=>a+b,0), chiave=[sl,sr].sort().join('+');
      if(t!==7){ errori++; SND.ko();
        const msg = t<7 ? 'POCHE! NE HAI '+t+'. QUANTE NE MANCANO?' : 'TROPPE! NE HAI '+t+'.';
        if(errori>=3 && !aiuto){ aiuto=true; toast('🦜','CONTIAMOLE INSIEME!',true); disegna(); } else toast('🦜',msg,true,2200);
        return; }
      if(tipo==='diverso' && S.combos.includes(chiave) && S.combos.length<2){
        SND.ko(); toast('🦜','QUESTO MODO L\'HA GIÀ USATO UN COMPAGNO! TROVANE UN ALTRO!',true,2600);
        parla('Questo modo l\'ha già usato un compagno! Trovane un altro!', 'pappagallo'); return; }
      if((tipo==='libero'||tipo==='diverso') && !S.combos.includes(chiave)){ S.combos.push(chiave); salva(); }
      SND.ok(); toast('⭐', sl+' + '+sr+' = 7!'); parla(sl+' più '+sr+' fa sette!');
      g++; perle(g,3); setTimeout(()=>g<3?giro():turnoFinito(),2000);
    }
    disegna();
  }
  giro();
};
function svgMano(lato, stato, bloccato, numeri){
  const col = lato==='L' ? '#e8413b' : '#2f6fe0', scuro = lato==='L' ? '#a52520' : '#1d47a3';
  const dita = [
    {x:62,  alto:44, w:26}, {x:94, alto:22, w:26}, {x:126, alto:34, w:26}, {x:158, alto:62, w:24}
  ];
  let g='';
  // pollice (indice 0)
  const pSu = stato[0];
  g += `<g class="dito ${bloccato?'bloccato':''}" data-m="${lato}" data-i="0">
    <rect x="-40" y="95" width="96" height="120" fill="transparent"/>
    ${pSu ? `<rect x="26" y="104" width="30" height="96" rx="15" fill="${col}" stroke="${scuro}" stroke-width="4" transform="rotate(-32 52 200)"/>`
          : `<rect x="36" y="150" width="30" height="44" rx="15" fill="${scuro}" stroke="${scuro}" stroke-width="4" transform="rotate(-10 50 190)"/>`}
  </g>`;
  dita.forEach((d,k)=>{
    const su = stato[k+1], top = su ? d.alto : 112;
    g += `<g class="dito ${bloccato?'bloccato':''}" data-m="${lato}" data-i="${k+1}">
      <rect x="${d.x-2}" y="10" width="${d.w+4}" height="140" fill="transparent"/>
      <rect x="${d.x}" y="${top}" width="${d.w}" height="${150-top}" rx="${d.w/2}" fill="${su?col:scuro}" stroke="${scuro}" stroke-width="4"/>
      ${bloccato&&su?`<rect x="${d.x}" y="${top+30}" width="${d.w}" height="10" fill="#ffc83d"/>`:''}
    </g>`;
  });
  g += `<rect x="54" y="120" width="134" height="118" rx="36" fill="${col}" stroke="${scuro}" stroke-width="4" pointer-events="none"/>
        <rect x="54" y="214" width="134" height="26" rx="8" fill="#fff" opacity=".85" pointer-events="none"/>`;
  if(bloccato && stato[0]) g += `<rect x="26" y="134" width="30" height="10" fill="#ffc83d" transform="rotate(-32 52 200)" pointer-events="none"/>`;
  // numeri di aiuto (calcolati sul disegno non specchiato)
  let n='';
  if(numeri){
    const cx=[6, 75, 107, 139, 170];
    numeri.forEach((v,k)=>{ if(!v) return; let x=cx[k], y = k===0 ? 150 : (dita[k-1].alto+26);
      if(lato==='L') x=200-x; n+=`<text x="${x}" y="${y}" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" stroke="#1d2433" stroke-width="1" font-family="Arial" pointer-events="none">${v}</text>`; });
  }
  const tr = lato==='L' ? 'transform="translate(200,0) scale(-1,1)"' : '';
  return `<svg viewBox="-45 0 290 250"><g ${tr}>${g}</g>${n}</svg>`;
}

/* ---------- ISOLA 4: IL PAPPAGALLO BUGIARDO ---------- */
SFIDE.pappagallo = function(liv){
  const primo = S.fatte[3]===0;
  const giri = shuffle(primo ? [7,5,9] : [6,7,8]);
  const colori=['#26c6da','#ff7043','#ffd23f','#ab47bc'];
  let g=0;
  function giro(){
    perle(g,3);
    let n=giri[g], fase=1, sel=null, errori=0, aiuto=false;
    const col=colori[g%4];
    let pos = liv===1 ? posizioniSecchielli(10,true) : posizioniSecchielli(10,false);
    const detto = liv===1 ? '7' : 'SETTE';
    istr(`IL PAPPAGALLO DICE: «QUI CI SONO ${detto} SECCHIELLI!» È VERO O È UNA BUGIA?`, 'pappagallo',
      [{t:'Qui ci sono sette secchielli!', chi:'pappagallo'}, {t:'Ciurma, è vero, o è una bugia?', chi:'capitano'}]);
    function disegna(){
      $('#stage').innerHTML=`<div class="pannelloSabbia" id="spiaggia">
        ${pos.slice(0,n).map((p,k)=>`<div class="ogg secch" data-k="${k}" style="left:${p[0]}%;top:${p[1]}%;width:10vh;height:10.5vh;cursor:${fase===2?'pointer':'default'}">${svgSecchiello(col)}${aiuto?`<span class="etich">${k+1}</span>`:''}</div>`).join('')}
        <div class="medaglione" style="position:absolute;left:1.5vh;top:1.5vh;width:14vh;height:14vh" data-img="pappagallo"></div>
        <div class="fumetto" style="position:absolute;left:15vh;top:2vh;font-size:4vh">«${detto} SECCHIELLI!»</div>
      </div><div id="zona" class="col"></div>`;
      idrata($('#stage'));
      if(fase===1){
        $('#zona').innerHTML=`<div class="row"><button class="btn verde big scelta" data-v="vero">✔ VERO</button><button class="btn rosso big scelta" data-v="bugia">✖ BUGIA</button></div>${barraConferma()}`;
        $('#zona').querySelectorAll('.scelta').forEach(b=>b.onclick=()=>{ SND.click(); sel=b.dataset.v; $('#zona').querySelectorAll('.scelta').forEach(x=>x.style.outline=x===b?'1vh solid #ffc83d':'none'); });
        $('#conferma').onclick=verificaFase1;
      } else {
        $('#zona').innerHTML=`<div class="row"><button class="btn rosso big" id="meno">➖ TOGLI</button><button class="btn verde big" id="piu">➕ AGGIUNGI</button></div>${barraConferma()}`;
        $('#meno').onclick=()=>{ if(n>1){ n--; SND.click(); disegna(); } };
        $('#piu').onclick=()=>{ if(n<10){ n++; SND.click(); disegna(); } else toast('🪣','LA SPIAGGIA È PIENA!',true); };
        $('#spiaggia').querySelectorAll('.secch').forEach(s=>s.onclick=()=>{ if(n>1){ n--; SND.click(); disegna(); } });
        $('#conferma').onclick=verificaFase2;
      }
    }
    function verificaFase1(){
      if(!sel){ toast('☝','SCEGLI VERO O BUGIA!',true); return; }
      const vero = n===7;
      if(sel==='vero' && vero){ vinto('SÌ! È VERO, SONO 7!'); return; }
      if(sel==='bugia' && !vero){ SND.ok(); toast('🦜','SÌ, È UNA BUGIA!'); fase=2; sel=null;
        setTimeout(()=>{ istr('BRAVO! ORA SISTEMA TU I SECCHIELLI: TOGLI O AGGIUNGI FINO AD AVERNE ESATTAMENTE 7.'); disegna(); },1400); return; }
      errori++; SND.ko(); sel=null;
      if(errori>=2 && !aiuto){ aiuto=true; disegna(); toast('🦜','CONTIAMOLI INSIEME!',true); }
      else { toast('🦜','CONTA DI NUOVO CON IL DITO!',true); disegna(); }
    }
    function verificaFase2(){
      if(n===7){ vinto('PERFETTO: ADESSO SONO 7!'); return; }
      errori++; SND.ko();
      if(errori>=3 && !aiuto){ aiuto=true; disegna(); }
      toast('🦜', n<7 ? 'NE MANCANO ANCORA!' : 'SONO ANCORA TROPPI!', true);
    }
    function vinto(msg){ SND.ok(); toast('⭐',msg,false,1800); parla(msg); g++; perle(g,3); setTimeout(()=>g<3?giro():turnoFinito(),2000); }
    disegna();
  }
  giro();
};
function posizioniSecchielli(max, ordinate){
  if(ordinate){ const r=[]; for(let k=0;k<max;k++){ const riga=k<5?0:1, colonna=k%5; r.push([22+colonna*14, 45+riga*32]); } return r; }
  const celle=[]; for(let r=0;r<2;r++) for(let c=0;c<7;c++) celle.push([c,r]);
  return shuffle(celle).slice(0,max).map(([c,r])=>[14+c*12.3+(Math.random()*4-2), (r?78:47)+(Math.random()*6-3)]);
}

          <div style="font-size:10vh;font-weight:900">= <span style="color:#e8413b">7</span></div></div>
        <div class="facce">${ordine.map(v=>`<button data-v="${v}" class="scelta ${b===v?'sel':''}">${svgDado(v,'#8b5cf6')}</button>`).join('')}</div>
        ${mostraBarca?`<div class="row" style="gap:1vh"><span style="font-size:2.6vh;font-weight:900">LA BARCA DA 7 POSTI:</span><div class="barca">${posti}</div>${fuori}</div>`:''}
        ${barraConferma()}`;
      $('#stage').querySelectorAll('.facce button').forEach(x=>x.onclick=()=>{ SND.click(); b=+x.dataset.v; disegna(); });
      $('#conferma').onclick=verifica;
    }
    function verifica(){
      if(!b){ toast('☝','SCEGLI UNA FACCIA!',true); return; }
      if(a+b===7){ mostraBarca=true; disegna(); SND.ok(); toast('⭐',a+' + '+b+' = 7!'); parla(a+' più '+b+' fa sette!'); g++; perle(g,3); setTimeout(()=>g<3?giro():turnoFinito(),2200); return; }
      errori++; SND.ko(); mostraBarca=true; disegna();
      toast('🦜', a+b<7 ? 'NELLA BARCA CI SONO ANCORA POSTI VUOTI!' : 'TROPPI! QUALCUNO È CADUTO IN MARE!', true, 2200);
    }
    disegna();
  }
  giro();
};

/* ---------- ISOLA 7: LA ROTTA SEGRETA ---------- */
const MAPPE_ROTTA = {
  1:[ {s:[0,4], t:[5,2], r:[[2,4],[1,2],[4,3],[6,1],[3,1]]},
      {s:[0,0], t:[4,3], r:[[1,0],[2,2],[4,1],[5,3],[0,3]]},
      {s:[6,4], t:[2,1], r:[[5,4],[4,2],[2,3],[1,1],[6,0]]} ],
  2:[ {s:[0,2], t:[6,1], r:[[4,0],[2,4],[2,1],[1,1],[6,2],[5,2],[4,4],[0,1]]},
      {s:[0,4], t:[3,0], r:[[0,1],[1,2],[1,0],[4,4],[2,0],[3,2],[6,4],[2,4]]},
      {s:[6,0], t:[2,3], r:[[0,3],[3,3],[4,1],[5,2],[1,4],[0,4],[4,3],[5,1]]} ]
};
SFIDE.rotta = function(liv){
  const pool = MAPPE_ROTTA[liv].map((m,k)=>({m,id:liv+'-'+k})).filter(x=>!S.mappe.includes(x.id));
  const scelta = pool.length ? pick(pool) : {m:pick(MAPPE_ROTTA[liv]), id:'x'};
  if(scelta.id!=='x'){ S.mappe.push(scelta.id); salva(); }
  const M = scelta.m, rocce = new Set(M.r.map(p=>p.join(',')));
  const percorso = cercaPercorso(M);
  let prog=[], nave=M.s.slice(), visti={}, errori=0, aiuto = liv===1, inCorsa=false;
  perle(0,1);
  istr('PROGRAMMA LA NAVE CON LE FRECCE: DEVE ARRIVARE AL TESORO IN 7 PASSI, SENZA SBATTERE SUGLI SCOGLI!');
  const FR = {su:'⬆',giu:'⬇',sx:'⬅',dx:'➡'}, MOV={su:[0,-1],giu:[0,1],sx:[-1,0],dx:[1,0]};
  function disegna(attivo=-1){
    let celle='';
    for(let r=0;r<5;r++) for(let c=0;c<7;c++){
      const k=c+','+r; let dentro='';
      if(rocce.has(k)) dentro=svgSasso();
      else if(nave[0]===c&&nave[1]===r) dentro=`<span class="fondi" data-img="nave" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></span>`;
      else if(M.t[0]===c&&M.t[1]===r) dentro=`<span class="fondi" data-img="forziereChiuso" style="width:90%;height:90%;display:flex;align-items:center;justify-content:center"></span>`;
      else if(aiuto && percorso.has(k)) dentro='<span class="sasso"></span>';
      celle+=`<div class="cella">${dentro}${visti[k]?`<span class="passo">${visti[k]}</span>`:''}</div>`;
    }
    $('#stage').innerHTML=`<div class="rottaWrap"><div class="griglia">${celle}</div>
      <div class="comandi">
        <div class="frecce"><span></span><button data-d="su">⬆</button><span></span><button data-d="sx">⬅</button><button data-d="giu">⬇</button><button data-d="dx">➡</button></div>
        <div class="row" style="gap:1.5vh"><button class="btn bianco" id="cancella">⌫ CANCELLA</button><button class="btn bianco" id="daCapo">🔄 DA CAPO</button></div>
      </div></div>
      <div class="row" style="gap:2vh"><div class="programma">${Array.from({length:7},(_,k)=>`<div class="slot ${prog[k]?'pieno':''} ${k===attivo?'attivo':''}">${prog[k]?FR[prog[k]]:''}<small>${k+1}</small></div>`).join('')}</div>
      <button class="btn verde big" id="via">⛵ VIA!</button></div>`;
    idrata($('#stage'));
    if(inCorsa) return;
    $('#stage').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
      if(prog.length>=7){ SND.ko(); toast('7️⃣','IL PROGRAMMA HA SOLO 7 CASELLE!',true); return; }
      prog.push(b.dataset.d); SND.click(); disegna(); });
    $('#cancella').onclick=()=>{ prog.pop(); SND.click(); disegna(); };
    $('#daCapo').onclick=()=>{ prog=[]; reset(); disegna(); };
    $('#via').onclick=corri;
  }
  function reset(){ nave=M.s.slice(); visti={}; }
  async function corri(){
    if(!prog.length){ toast('☝','PRIMA METTI LE FRECCE!',true); return; }
    inCorsa=true; reset(); disegna();
    for(let k=0;k<prog.length;k++){
      await wait(550);
      const d=MOV[prog[k]], nx=nave[0]+d[0], ny=nave[1]+d[1];
      if(nx<0||nx>6||ny<0||ny>4){ return schianto('LA NAVE È USCITA DALLA MAPPA!'); }
      if(rocce.has(nx+','+ny)){ return schianto('CRASH! UNO SCOGLIO!'); }
      nave=[nx,ny]; visti[nx+','+ny]=k+1; SND.tic(); disegna(k);
    }
    await wait(500); inCorsa=false;
    if(nave[0]===M.t[0]&&nave[1]===M.t[1]&&prog.length===7){
      SND.ok(); coriandoli(1500); toast('💰','TESORO! 7 PASSI ESATTI!',false,2000); parla('Tesoro! Sette passi esatti!');
      perle(1,1); setTimeout(turnoFinito,2300); return; }
    errori++; SND.ko();
    if(prog.length<7) toast('🦜','MANCANO ANCORA '+(7-prog.length)+' PASSI!',true,2200);
    else toast('🦜','NON SIAMO AL TESORO! RIPROVA',true,2200);
    dopoErrore();
  }
  function schianto(msg){ inCorsa=false; errori++; SND.crash(); toast('💥',msg,true,2000); setTimeout(()=>{ reset(); disegna(); },1200); dopoErrore(); }
  function dopoErrore(){ if(errori>=3 && !aiuto){ aiuto=true; setTimeout(()=>{ istr('SEGUI I SASSOLINI BIANCHI: TI MOSTRANO LA ROTTA!','pappagallo'); disegna(); },1300); } else setTimeout(()=>{ if(!inCorsa){ reset(); disegna(); } },1300); }
  disegna();
};
function cercaPercorso(M){
  const roc=new Set(M.r.map(p=>p.join(','))), key=p=>p.join(','), prev={}, q=[M.s]; prev[key(M.s)]=null;
  while(q.length){ const p=q.shift(); if(p[0]===M.t[0]&&p[1]===M.t[1]) break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n=[p[0]+dx,p[1]+dy];
      if(n[0]<0||n[0]>6||n[1]<0||n[1]>4||roc.has(key(n))||key(n) in prev) continue; prev[key(n)]=key(p); q.push(n); } }
  const res=new Set(); let k=prev[key(M.t)];
  while(k && k!==key(M.s)){ res.add(k); k=prev[k]; }
  return res;
}

/* ---------- FORZIERE FINALE ---------- */
SFIDE.finale = function(liv){
  const R1 = [{v:'4'},{v:'7',ok:1},{v:'1'},{v:'7',spec:1},{v:'9'},{v:'6'}];
  const R2 = [{v:'SEI'},{v:'SETE'},{v:'SETTE',ok:1},{v:'OTTO'},{v:'STETE'}];
  const R3 = [{v:5},{v:6},{v:7,ok:1},{v:8}];
  const ruote=[R1,R2,R3]; const idx=ruote.map(r=>{ let k; do{k=rnd(r.length);}while(r[k].ok); return k; });
  let errate=[];
  perle(0,1);
  istr('ULTIMA SFIDA! GIRA LE TRE RUOTE DEL FORZIERE: CERCA IL NUMERO 7, LA PAROLA SETTE E 7 PALLINI.');
  function contenuto(r,k){
    const it=ruote[r][idx[r]];
    if(r===0) return it.spec?`<span style="display:inline-block;transform:scaleX(-1)">${it.v}</span>`:it.v;
    if(r===1) return it.v;
    return svgPallini(it.v);
  }
  function disegna(){
    $('#stage').innerHTML=`<div class="row" style="gap:5vh;align-items:center">
      <div class="forziereGrande fondi" data-img="forziereChiuso"></div>
      <div class="ruote">${[0,1,2].map(r=>`<div class="ruota"><button class="freccia" data-r="${r}" data-d="-1">▲</button>
        <div class="finestra ${r===1?'parola':''} ${errate.includes(r)?'err':''}">${contenuto(r)}</div>
        <button class="freccia" data-r="${r}" data-d="1">▼</button></div>`).join('')}</div></div>
      <div class="row"><span class="pollice">CIURMA: 👍 O 👎 ?</span><button class="btn oro big" id="apri">🔓 APRI IL FORZIERE!</button></div>`;
    idrata($('#stage'));
    $('#stage').querySelectorAll('.freccia').forEach(b=>b.onclick=()=>{ const r=+b.dataset.r, d=+b.dataset.d, L=ruote[r].length; idx[r]=(idx[r]+d+L)%L; errate=[]; SND.click(); disegna(); });
    $('#apri').onclick=prova;
  }
  function prova(){
    const sbagliate=[0,1,2].filter(r=>!ruote[r][idx[r]].ok);
    if(sbagliate.length){ SND.ko();
      if(liv===1){ errate=sbagliate; disegna(); toast('🔒', sbagliate.length===1?'UNA RUOTA NON È GIUSTA!':'ALCUNE RUOTE NON SONO GIUSTE!', true, 2000); }
      else toast('🔒','IL FORZIERE NON SI APRE...',true,2000);
      return; }
    apertura();
  }
  async function apertura(){
    perle(1,1); turnoFinito();
    SND.lucchetto(); await wait(500);
    $('#stage').innerHTML=`<div class="forziereGrande fondi" data-img="forziereAperto" style="width:34vh;height:25vh"></div><div class="monete" id="monete"></div><div id="fineTesto" class="col"></div>`;
    idrata($('#stage'));
    istr('IL FORZIERE SI È APERTO! CONTIAMO LE MONETE DEL TESORO!');
    await wait(2800);
    for(let k=1;k<=7;k++){ const m=document.createElement('div'); m.className='moneta'; m.textContent=k; $('#monete').appendChild(m); SND.moneta(); await wait(800); }
    SND.fanfara(); coriandoli(5000);
    $('#fineTesto').innerHTML=`<p style="font-size:4vh;font-weight:900;color:#c62828;margin:0">7 MONETE! IL TESORO DI CAPITAN SETTE È VOSTRO!</p><button class="btn verde big" id="diploma">🏆 IL DIPLOMA DELLA CIURMA</button>`;
    parla('Sette monete! Il tesoro di Capitan Sette è vostro!');
    $('#diploma').onclick=diploma;
  }
  disegna();
};

    <p class="nota">Le voci più naturali ci sono aprendo il gioco con <b>Microsoft Edge</b> e internet attivo: Diego o Giuseppe per il capitano, Isabella o Elsa (Natural) per il pappagallo. Con Chrome su Windows l'unica voce da uomo è Cosimo, più metallica. Voci italiane trovate su questo computer: ${VOCI_IT.length}.</p>` : ''}
    <label>Vai direttamente a un'isola (il turno va al prossimo mozzo):</label>

  </div>`);
  const salvaLink=()=>{ S.links.talpe=$('#lkT').value.trim(); S.links.gruppi=$('#lkG').value.trim(); S.links.bonus=$('#lkB').value.trim(); S.voce=$('#ckVoce').checked; S.autoLettura=$('#ckAuto').checked;
    if($('#selCap')){ S.voceCap=$('#selCap').value; S.vocePap=$('#selPap').value; }
    if(!S.voce && voceDisponibile()) speechSynthesis.cancel();
    salva(); aggiornaAscolta(); };
  $('#pSalva').onclick=()=>{ salvaLink(); chiudiOvl(); if($('#sSfida').classList.contains('on') && ISOLE[SFIDA.isola].tipo==='ww') avviaSfida(SFIDA.isola, SFIDA.livello); };
  $('#pSalta').onclick=()=>{ salvaLink(); chiudiOvl(); if($('#sSfida').classList.contains('on') && SFIDA.isola<7) turnoFinito(); };
  if($('#provaCap')){

function opzioniVoce(chi, scelta){

    ordinate.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}" ${v.name===scelta?'selected':''}>${v.name}${MASCHILI.test(v.name)?' – uomo':''}</option>`).join('');
}
